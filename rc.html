<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RC Rover Controller - Shelly Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }
        .camera-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        .camera-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .hud-header {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }
        .hud-pill {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
        }
        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
        .mono {
            font-family: 'JetBrains Mono', monospace;
            color: #38bdf8;
            font-weight: 600;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
        }
        .status-dot.online {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .controls-hud {
            position: absolute;
            bottom: 28px;
            left: 28px;
            right: 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
        }
        .dpad-grid {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(3, 76px);
            grid-template-rows: repeat(2, 76px);
            gap: 10px;
        }
        .rc-btn {
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.08s ease, background 0.08s ease;
            touch-action: manipulation;
        }
        .rc-btn small {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 2px;
        }
        .rc-btn.active, .rc-btn:active {
            background: #38bdf8;
            color: #090d16;
            border-color: #38bdf8;
            transform: scale(0.95);
        }
        .rc-btn.active small, .rc-btn:active small {
            color: #090d16;
        }
        .stop-btn {
            pointer-events: auto;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.85);
            border-color: #f87171;
        }
        .stop-btn.active, .stop-btn:active {
            background: #dc2626;
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <img src="/video_feed" alt="Live RC Camera Stream">
    </div>

    <div class="hud-header">
        <div class="hud-pill">
            <a href="/" class="back-link">◀ Back to Shelly Control Panel</a>
            <span>|</span>
            <span>Action: <span id="action-state" class="mono">STOP</span></span>
        </div>
        <div class="hud-pill">
            <span id="ws-dot" class="status-dot"></span>
            <span id="ws-status">Connecting...</span>
        </div>
    </div>

    <div class="controls-hud">
        <div class="dpad-grid">
            <div></div>
            <button class="rc-btn" data-cmd="forward">▲<small>W</small></button>
            <div></div>
            <button class="rc-btn" data-cmd="left">◀<small>A</small></button>
            <button class="rc-btn" data-cmd="backward">▼<small>S</small></button>
            <button class="rc-btn" data-cmd="right">▶<small>D</small></button>
        </div>

        <button class="rc-btn stop-btn" data-cmd="stop">
            STOP<small>SPACE</small>
        </button>
    </div>

    <script>
        const actionState = document.getElementById('action-state');
        const wsDot = document.getElementById('ws-dot');
        const wsStatus = document.getElementById('ws-status');

        let ws;
        let currentCmd = 'stop';
        const heldKeys = new Set();

        function connectWS() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${window.location.host}/ws/control`);

            ws.onopen = () => {
                wsDot.classList.add('online');
                wsStatus.textContent = 'GPIO Linked';
            };

            ws.onmessage = (e) => {
                if (e.data.startsWith('state:')) {
                    actionState.textContent = e.data.split(':')[1].toUpperCase();
                }
            };

            ws.onclose = () => {
                wsDot.classList.remove('online');
                wsStatus.textContent = 'Reconnecting...';
                setTimeout(connectWS, 1000);
            };
        }

        function sendCmd(cmd) {
            if (cmd === currentCmd && cmd !== 'stop') return;
            currentCmd = cmd;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
            }
            document.querySelectorAll('.rc-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.cmd === cmd && cmd !== 'stop');
            });
        }

        const keyMap = {
            KeyW: 'forward', ArrowUp: 'forward',
            KeyS: 'backward', ArrowDown: 'backward',
            KeyA: 'left', ArrowLeft: 'left',
            KeyD: 'right', ArrowRight: 'right',
            Space: 'stop'
        };

        window.addEventListener('keydown', (e) => {
            const cmd = keyMap[e.code];
            if (!cmd) return;
            e.preventDefault();
            if (cmd === 'stop') {
                heldKeys.clear();
                sendCmd('stop');
                return;
            }
            heldKeys.add(e.code);
            sendCmd(cmd);
        });

        window.addEventListener('keyup', (e) => {
            if (!keyMap[e.code]) return;
            heldKeys.delete(e.code);
            if (heldKeys.size === 0) {
                sendCmd('stop');
            } else {
                const prevKey = Array.from(heldKeys).pop();
                sendCmd(keyMap[prevKey]);
            }
        });

        document.querySelectorAll('.rc-btn').forEach(btn => {
            const cmd = btn.dataset.cmd;
            const start = (e) => { e.preventDefault(); sendCmd(cmd); };
            const end = (e) => { e.preventDefault(); if (cmd !== 'stop') sendCmd('stop'); };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('mouseleave', end);
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end, { passive: false });
            btn.addEventListener('touchcancel', end, { passive: false });
        });

        window.addEventListener('blur', () => {
            heldKeys.clear();
            sendCmd('stop');
        });

        connectWS();
    </script>
</body>
</html>
